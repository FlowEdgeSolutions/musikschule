services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: schnittke
      POSTGRES_USER: schnittke
      POSTGRES_PASSWORD: schnittke
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schnittke -d schnittke"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://schnittke:schnittke@postgres:5432/schnittke
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-dev-change-me}
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      PUBLIC_BASE_URL: http://localhost:8000
      UPLOAD_DIR: /app/uploads
      AUTO_CREATE_TABLES: "true"
      SEED_ON_STARTUP: "true"
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:
